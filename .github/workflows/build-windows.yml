name: Build SANTA RECORDER for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name SantaRecorder --collect-all imageio_ffmpeg app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Santa-Recorder-Windows
          path: dist/SantaRecorder/
